# Verifier VS Agent — Helm chart values (Verana v0.10.1+)
#
# Network and service name are derived from the branch name. The workflow
# substitutes __NETWORK__, __VS_NAME__, __CHILD_VS_NAME__, __CORPORATION_ID__
# and __DPP_VS_DID__ placeholders at deploy time.
chartSource: oci://registry-1.docker.io/veranalabs/vs-agent-chart
chartVersion: v2.0.0-dev.97

global:
  domain: __VS_NAME__.demos.__NETWORK__.verana.network

name: __CHILD_VS_NAME__
replicas: 1

adminPort: 3000
didcommPort: 3001
publicDidMethod: "webvh"
enablePublicApiSwagger: true

# Agent-only service for the first coherent deploy — no companion web app yet.
eventsWebhookUrl: ""

adminApiAuthMode: "internal"
adminApiTrustedNetworks: "127.0.0.0/8,::1/128,10.2.0.0/16"

veranaRpcEndpointUrl: "https://rpc.__NETWORK__.verana.network"
veranaIndexerBaseUrl: "https://idx.__NETWORK__.verana.network"
veranaChainId: "vna-__NETWORK__-1"
veranaCorporationId: "__CORPORATION_ID__"

agentMode: "delegated"
delegatedParentVsDid: "__DPP_VS_DID__"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  host: "verifier-vs.__VS_NAME__.demos.__NETWORK__.verana.network"
  tlsSecret: "verifier-vs.__VS_NAME__.demos.__NETWORK__.verana.network-cert"
  public:
    enableCors: true
  private:
    enableCors: true
    whitelistSourceRange: ""
    tlsSecret: ""
    host: ""

extraEnv:
  - name: AGENT_LOG_LEVEL
    value: "debug"
  - name: VERANA_GAS_PRICE
    value: "0.01uvna"
  - name: USE_CORS
    value: "true"
  - name: VERANA_ACCOUNT_MNEMONIC
    valueFrom:
      secretKeyRef:
        name: verifier-vs-secrets
        key: VERIFIER_VS_AGENT_MNEMONIC
  - name: ECS_CLAIMS_SERVICE_NAME
    value: "DPP Verification Service (demo)"
  - name: ECS_CLAIMS_SERVICE_TYPE
    value: "WEB_PORTAL"
  - name: ECS_CLAIMS_SERVICE_DESCRIPTION
    value: "Verification service for the Digital Product Passport ecosystem"
  - name: ECS_CLAIMS_SERVICE_LOGO_URI
    value: "https://verana.io/logo.svg"
  - name: ECS_CLAIMS_SERVICE_MINIMUM_AGE_REQUIRED
    value: "18"
  - name: ECS_CLAIMS_SERVICE_TERMS_AND_CONDITIONS_URI
    value: "https://verifier-vs.__VS_NAME__.demos.__NETWORK__.verana.network/vt/default/terms.html"
  - name: ECS_CLAIMS_SERVICE_PRIVACY_POLICY_URI
    value: "https://verifier-vs.__VS_NAME__.demos.__NETWORK__.verana.network/vt/default/privacy.html"

storage:
  size: 1Gi
  storageClassName: csi-cinder-high-speed
