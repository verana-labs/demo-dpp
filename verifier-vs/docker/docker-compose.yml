# =============================================================================
# Verifier VS — Local Docker Compose
# =============================================================================
#
# Prerequisites:
#   - Docker and Docker Compose installed
#   - ngrok running on port 3013
#
# Usage:
#   export NGROK_DOMAIN=your-domain.ngrok-free.app
#   docker compose up
#
# =============================================================================

services:
  vs-agent:
    image: ${VS_AGENT_IMAGE:-veranalabs/vs-agent:v2.0.0-dev.97}
    platform: linux/amd64
    ports:
      - "${VS_AGENT_ADMIN_PORT:-3012}:3000"
      - "${VS_AGENT_PUBLIC_PORT:-3013}:3001"
    environment:
      - PUBLIC_API_BASE_URL=https://${NGROK_DOMAIN}
      - AGENT_PUBLIC_DID_METHOD=webvh
      - AGENT_LABEL=${SERVICE_NAME:-DPP Verification Service (demo)}
      - ENABLE_PUBLIC_API_SWAGGER=true
    volumes:
      - vs-agent-data:/root/.afj

volumes:
  vs-agent-data:
